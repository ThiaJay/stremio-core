name: Build

on:
  # build on each push as we build the stremio-core-web npm package
  # and upload it to gh-pages for testing with stremio-web.
  # For pull requests we do not build the package and if
  # developer pushes a commit without opening a PR
  # this will still create a package for testing!
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - development

# Stops the running workflow of previous pushes
concurrency:
  # cancel per workflow
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    # Same-repository branches are checked on push so they can publish a testing package.
    # Pull request runs are only needed for forks, whose pushes do not run here.
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    name: "stremio-core-*: Lint, test and build"
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v7

    # we use older stable version because our old version of `wasm-bindgen` is not compatible with >= 1.86
    - name: Rust setup (stable, 1.85)
      uses: dtolnay/rust-toolchain@1.85
      with:
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - name: Lint - rustfmt
      run: cargo fmt --all -- --check

    - name: Lint - clippy
      run: cargo clippy --all --no-deps -- -D warnings

    - name: Test
      run: cargo test

    - name: Build
      run: cargo build

  build-stremio-core-web:
    name: "stremio-core-web: test (wasm) and build"
    concurrency:
      group: stremio-core-gh-pages-write
      cancel-in-progress: false
    permissions:
      contents: write

    env:
      NODE_VERSION: 12
      WASM_PACK_VERSION: 0.14.0
      RUST_VERSION: '1.95'
    # No need to check core-web if core itself is not passing
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust setup
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rust-std
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2.87.15
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Setup chromedriver
        uses: nanasess/setup-chromedriver@v3

      - name: Run wasm tests (Chrome)
        working-directory: stremio-core-web
        run: wasm-pack test --chromedriver "$(which chromedriver)" --chrome --headless

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: stremio-core-web/package-lock.json

      - name: Install NPM dependencies
        working-directory: stremio-core-web
        run: npm ci

      - name: Build (release)
        if: ${{ ! startsWith(github.ref, 'refs/pull/') }}
        working-directory: stremio-core-web
        run: npm run build

      # if merge request, the ref_name will be e.g. `705/merge`
      # so we need to recursively create these 2 folders
      # create folder for release and dev builds to be published on GH pages
      - run: mkdir -p ./build/${{ github.ref_name }}/dev
        if: ${{ ! startsWith(github.ref, 'refs/pull/') }}
        working-directory: stremio-core-web

      - name: Package (release)
        if: ${{ ! startsWith(github.ref, 'refs/pull/') }}
        working-directory: stremio-core-web
        run: npm pack

      - name: Record release package digests
        if: ${{ ! startsWith(github.ref, 'refs/pull/') }}
        working-directory: stremio-core-web
        run: |
          package=$(printf '%s\n' ./*.tgz)
          echo "release_sha1=$(sha1sum "$package" | awk '{print $1}')"
          echo "release_integrity=sha512-$(openssl dgst -sha512 -binary "$package" | base64 -w 0)"

      - name: Copy release package archive
        if: ${{ ! startsWith(github.ref, 'refs/pull/') }}
        working-directory: stremio-core-web
        run: mv ./*.tgz ./build/${{ github.ref_name }}

      - name: Build (dev)
        working-directory: stremio-core-web
        run: npm run build-dev

      - name: Package (dev)
        if: ${{ ! startsWith(github.ref, 'refs/pull/') }}
        working-directory: stremio-core-web
        run: npm pack

      - name: Record dev package digests
        if: ${{ ! startsWith(github.ref, 'refs/pull/') }}
        working-directory: stremio-core-web
        run: |
          package=$(printf '%s\n' ./*.tgz)
          echo "dev_sha1=$(sha1sum "$package" | awk '{print $1}')"
          echo "dev_integrity=sha512-$(openssl dgst -sha512 -binary "$package" | base64 -w 0)"
        
      - name: Copy dev package archive
        if: ${{ ! startsWith(github.ref, 'refs/pull/') }} 
        working-directory: stremio-core-web
        run: mv ./*.tgz ./build/${{ github.ref_name }}/dev
        
      - name: Deploy gh-pages
        if: ${{ ! startsWith(github.ref, 'refs/pull/')  &&  github.actor != 'dependabot[bot]' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Publish only this ref's freshly built package tree. Scoping both source and
          # destination lets the deploy replace stale same-version archives without
          # deleting package trees belonging to sibling branches.
          publish_dir: ./stremio-core-web/build/${{ github.ref_name }}
          destination_dir: ./stremio-core-web/${{ github.ref_name }}/
          keep_files: false
          allow_empty_commit: true
