name: A V session safety reconciliation
on:
  push:
    branches: [reconcile/av-sync-v2-20260923]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: av-sync-reconcile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Integrate accepted A V bindings into exact current tree
        run: python3 scripts/integrate-av-sync-v2.py
      - name: Format candidate files
        run: cargo fmt --all
      - name: Full Core tests lint and build
        run: |
          cargo test --locked
          cargo clippy --locked --all --no-deps -- -D warnings
          cargo build --locked
      - name: Retain validated sources
        uses: actions/upload-artifact@v4
        with:
          name: av-sync-reconciled-sources
          retention-days: 7
          path: |
            src/models/player.rs
            src/types/player.rs
            src/types/player/av_sync_v2.rs
            src/runtime/msg/action.rs
            stremio-core-web/src/model/serialize_player.rs
  persist:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: av-sync-reconciled-sources
      - name: Save only the exact validated bindings
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/reconcile/av-sync-v2-20260923 | cut -f1)" = "$EXPECTED_SHA"
          git add -- src/models/player.rs src/types/player.rs src/types/player/av_sync_v2.rs src/runtime/msg/action.rs stremio-core-web/src/model/serialize_player.rs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile validated A V session safety with current development'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/reconcile/av-sync-v2-20260923
