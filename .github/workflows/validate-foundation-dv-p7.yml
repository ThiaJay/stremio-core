name: Validate Foundation Dolby Vision Profile 7

on:
  push:
    branches:
      - 'validation/foundation-dv-p7-*'
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify exact Foundation source receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('validation/foundation-dv-p7/SOURCE.json').read_text(encoding='utf-8'))
          assert source['schema'] == 1
          assert source['sourceRepository'] == 'ThiaJay/stremio-development-foundation'
          assert source['sourceCommit'] == '6f13c17a92175ae32a0bf06bea08bc4ffb33dd13'
          assert source['sourceTree'] == '417a9f2ea971167d957f4c86c2927f785f254905'
          assert source['reconciledMain'] == '6ffcf89b553787ea9f8892580601483440a997a2'
          assert source['originalPrHead'] == '982e64833c8318028b7217765025d3064f0bfed2'
          expected = {
              'upstream-candidates/stremio-video-playback-health/playback-health-contract.cjs': '060ae0fee8efda6dd5425333d729353171704761',
              'upstream-candidates/stremio-video-playback-health/playback-health-contract.test.cjs': 'd7bea26733a127001d343dcab5db88ccab68861b',
          }
          actual = {entry['path']: entry['gitBlob'] for entry in source['sourceFiles']}
          assert actual == expected
          PY
          test "$(git hash-object validation/foundation-dv-p7/playback-health-contract.cjs)" = "060ae0fee8efda6dd5425333d729353171704761"
          test "$(git hash-object validation/foundation-dv-p7/playback-health-contract.test.cjs)" = "d7bea26733a127001d343dcab5db88ccab68861b"

      - name: Validate syntax
        run: |
          node --check validation/foundation-dv-p7/playback-health-contract.cjs
          node --check validation/foundation-dv-p7/playback-health-contract.test.cjs

      - name: Run deterministic playback health regressions
        run: node --test validation/foundation-dv-p7/playback-health-contract.test.cjs
